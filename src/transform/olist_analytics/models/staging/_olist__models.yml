version: 2

models:
  - name: stg_olist__orders
    description: "Commandes nettoyées et typées, 1 ligne par commande."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['created', 'approved', 'invoiced', 'processing', 'shipped', 'delivered', 'canceled', 'unavailable']
      - name: ordered_at
        data_tests: [not_null]

  - name: stg_olist__order_items
    description: "Articles des commandes, 1 ligne par (order_id, order_item_id)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: item_price
        description: "Prix de l'article en BRL."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: freight_value
        description: "Frais de port de l'article en BRL."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_olist__order_payments
    description: "Lignes de paiement, 1 ligne par (order_id, payment_sequential)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_type
        description: "Moyen de paiement, NULL quand la source indique 'not_defined'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card']
      - name: payment_value
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_olist__order_reviews
    description: "Avis clients, 1 ligne par (review_id, order_id) : un avis peut couvrir plusieurs commandes et une commande avoir plusieurs avis."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__customers
    description: "Clients, 1 ligne par customer_id (un customer_id par commande)."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: "Identifiant de la personne, commun à toutes ses commandes."
        data_tests: [not_null]

  - name: stg_olist__products
    description: "Produits, 1 ligne par produit."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_name_pt
        description: "Catégorie en portugais, NULL pour 610 produits."

  - name: stg_olist__sellers
    description: "Vendeurs, 1 ligne par vendeur."
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_olist__geolocation
    description: "Points GPS typés, plusieurs lignes par préfixe de code postal."
    columns:
      - name: zip_code_prefix
        data_tests: [not_null]

  - name: stg_olist__product_category_name_translation
    description: "Traduction des catégories produit, 1 ligne par catégorie."
    columns:
      - name: category_name_pt
        data_tests: [unique, not_null]
