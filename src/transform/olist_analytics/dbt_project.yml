name: olist_analytics
version: "1.0.0"
profile: olist_analytics
# Syntaxe `arguments:` des tests génériques : dbt >= 1.10
require-dbt-version: [">=1.10.0", "<2.0.0"]

vars:
  WAREHOUSE_HOST: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
  WAREHOUSE_PORT: "{{ env_var('WAREHOUSE_PORT', '5432') }}"
  WAREHOUSE_DB: "{{ env_var('WAREHOUSE_DB', 'olist_analytics') }}"
  WAREHOUSE_USER: "{{ env_var('WAREHOUSE_USER', 'postgres') }}"
  WAREHOUSE_PASSWORD: "{{ env_var('WAREHOUSE_PASSWORD', 'postgres') }}"

clean-targets:
  - target
  - dbt_packages

# Une couche = un dossier = un schéma PostgreSQL (voir macros/generate_schema_name.sql)
models:
  olist_analytics:
    # view : simple renommage/typage, recalculé à chaque lecture (rien de stocké)
    staging:
      +materialized: view
      +schema: staging
    # table : jointures et agrégations lourdes réutilisées par plusieurs marts, calculées une seule fois
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
